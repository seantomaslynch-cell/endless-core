workflows:
  ios-capacitor-build:
    name: iOS Capacitor Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: lts
      xcode: latest
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      # No `cocoapods:` version pinned here — this project has no Podfile.
      # @capacitor/ios resolves its native dependencies via Swift Package
      # Manager (see ios/App/CapApp-SPM), which Xcode handles itself during
      # the build step below.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Sync web assets into the iOS project
        script: |
          # ios/App/App/public and ios/App/App/capacitor.config.json are
          # gitignored (see ios/.gitignore) — they're generated by `cap
          # sync`, not committed, so this step is required every build.
          npm run sync:ios
      - name: Build for iOS Simulator (no code signing required)
        script: |
          # A signing-free build is the right first workflow: it proves the
          # whole pipeline (npm install -> Capacitor sync -> Xcode build)
          # actually compiles, without requiring Apple certificates/
          # provisioning profiles to already be configured in the Codemagic
          # dashboard. Once real code signing is set up (see
          # https://docs.codemagic.io/yaml-code-signing/signing-ios/), add a
          # release workflow using `xcode-project build-ipa` for a
          # distributable .ipa artifact.
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - /tmp/xcodebuild_logs/*.log
