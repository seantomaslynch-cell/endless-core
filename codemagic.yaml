workflows:
  ios-capacitor-build:
    name: iOS Capacitor Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: lts
      xcode: latest
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      # No `cocoapods:` version pinned here — this project has no Podfile.
      # @capacitor/ios resolves its native dependencies via Swift Package
      # Manager (see ios/App/CapApp-SPM), which Xcode handles itself during
      # the build step below.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Sync web assets into the iOS project
        script: |
          # ios/App/App/public and ios/App/App/capacitor.config.json are
          # gitignored (see ios/.gitignore) — they're generated by `cap
          # sync`, not committed, so this step is required every build.
          npm run sync:ios
      - name: Build for iOS Simulator (no code signing required)
        script: |
          # A signing-free build is the right first workflow: it proves the
          # whole pipeline (npm install -> Capacitor sync -> Xcode build)
          # actually compiles, without requiring Apple certificates/
          # provisioning profiles to already be configured in the Codemagic
          # dashboard. Once real code signing is set up (see
          # https://docs.codemagic.io/yaml-code-signing/signing-ios/), add a
          # release workflow using `xcode-project build-ipa` for a
          # distributable .ipa artifact.
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - /tmp/xcodebuild_logs/*.log

  ios-release:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    # Manual trigger only (no `triggering:` block) — this produces a real
    # signed build and submits it to TestFlight, so it should be a deliberate
    # "Start new build" click in the Codemagic UI, not something that fires
    # on every push to master.
    integrations:
      app_store_connect: "Endless Core: Mining Rush"
    environment:
      node: lts
      xcode: latest
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        # The app's numeric Apple ID (NOT the bundle identifier) — App Store
        # Connect > your app > General > App Information > Apple ID.
        APP_STORE_APPLE_ID: "CHANGE_ME_numeric_apple_id"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.zenzrack.endlesscore
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Sync web assets into the iOS project
        script: npm run sync:ios
      - name: Increment build number
        script: |
          # Every TestFlight/App Store upload needs a build number strictly
          # higher than the last one Apple already has for this app, or the
          # upload is rejected outright. agvtool needs VERSIONING_SYSTEM =
          # apple-generic on the App target (already set in
          # ios/App/App.xcodeproj/project.pbxproj) to have anywhere to write
          # the new value.
          cd "$CM_BUILD_DIR/ios/App"
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID")
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        # Uploads to TestFlight automatically; leave submit_to_app_store
        # unset (defaults to false) until you're actually ready to release —
        # add `submit_to_app_store: true` here when that day comes.
        submit_to_testflight: true
